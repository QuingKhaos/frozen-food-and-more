frozen-food-and-more-tweaks-muluna-cryogenics=Adds exploration science pack from Muluna to the cryogenics technology.
frozen-food-and-more-tweaks-hide-frozen-food=Hides all frozen food items and their recipes from the crafting menu and the factoriopedia, same principle as vanilla barreling items and recipes are hidden too.
